# RA2Web reverse proxy: TLS termination + WebSocket proxying to the Bun WOL server.
#
# Setup
# -----
#   1. Build the client and place it where nginx serves it:
#        cd <repo> && bun run build        # outputs ./dist
#      then point `root` below at that dist directory (or copy it to /srv/ra2web/dist).
#   2. Run the Bun server behind nginx (bind to loopback):
#        cd server && SERVER_HOST=127.0.0.1 \
#          EXTERNAL_URL=wss://game.example.com \
#          WOL_URL_PATH=/wol \
#          CORS_ALLOWED_ORIGINS=https://game.example.com \
#          bun run dev
#      - EXTERNAL_URL is what clients use for wss:// and the gserv URL handed out in
#        STARTG (it must be the public wss base, e.g. wss://game.example.com).
#      - WOL_URL_PATH=/wol makes the WOL WebSocket live at /wol so the static root can
#        serve the client without fighting over the / location.
#      - CORS_ALLOWED_ORIGINS is optional but recommended in production.
#   3. Point the client's config.ini at this nginx:
#        serversUrl=https://game.example.com/servers.ini
#      The server generates /servers.ini from EXTERNAL_URL + WOL_URL_PATH.
#   4. TLS: use certbot --nginx -d game.example.com (paths below are the defaults).
#
# CDN note: the client's config.ini references /cdn/game-res/v2/, /cdn/maps/, /cdn/mods/.
# Add locations for those (or leave them to an existing CDN) as needed; they are not
# served by the Bun server or by this file.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name game.example.com;

    # Let ACME/HTTP-01 challenges through before redirecting everything else.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name game.example.com;

    ssl_certificate     /etc/letsencrypt/live/game.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    client_max_body_size 100m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # ---- WOL lobby/channel WebSocket (wss://game.example.com/wol) ----
    location = /wol {
        proxy_pass http://127.0.0.1:9090/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- gserv match-relay WebSocket (wss://game.example.com/gserv) ----
    location = /gserv {
        proxy_pass http://127.0.0.1:9090/gserv;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- HTTP API (login, register, gateway auth, servers.ini, health) ----
    location ~ ^/(login|register|auth(/.*)?|servers\.ini|health)$ {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Static client (built ./dist) ----
    location / {
        root /srv/ra2web/dist;
        try_files $uri $uri/ /index.html;
    }

    # Hashed/vendor assets are cacheable long-term.
    location ~* \.(js|css|png|jpe?g|gif|svg|webp|woff2?|ttf|eot|otf|mp3|ogg|wasm|mix|ini)$ {
        root /srv/ra2web/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
