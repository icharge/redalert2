# RA2Web reverse proxy behind Cloudflare: TLS is terminated by Cloudflare, so nginx
# only proxies plain HTTP/WebSocket to the Bun WOL server. Let's Encrypt is handled
# by Cloudflare (SSL/TLS tab) — nginx manages no certificates here.
#
# Hosts
# -----
#   play.thaira2.com   static-only web host serving the built client (dist/). This
#                      nginx does NOT serve static files.
#   service.thaira2.com   everything here is proxied straight to the Bun server.
#
# Setup
# -----
#   1. Run the Bun server behind nginx (bind to loopback). EXTERNAL_URL and
#      WOL_URL_PATH are REQUIRED and must be the public wss URLs clients see,
#      because the server generates /servers.ini from them:
#        cd server && SERVER_HOST=127.0.0.1 \
#          EXTERNAL_URL=wss://service.thaira2.com \
#          WOL_URL_PATH=/wol \
#          CORS_ALLOWED_ORIGINS=https://play.thaira2.com \
#          bun run dev
#      - EXTERNAL_URL=wss://service.thaira2.com makes /servers.ini advertise
#        wolUrl="wss://service.thaira2.com/wol". If this is wrong (e.g. ws:// or a
#        missing /wol), HTTPS pages block the connection as mixed content — the
#        client logs "attempted to connect to the insecure WebSocket endpoint".
#      - WOL_URL_PATH=/wol keeps the WOL WebSocket at /wol so it never collides
#        with the static web root on play.thaira2.com.
#      - CORS_ALLOWED_ORIGINS must list the PAGE origin that connects to this
#        server, i.e. https://play.thaira2.com (comma-separate more if needed).
#        The server rejects WebSocket upgrades with 403 unless the handshake's
#        Origin is in this list, and HTTP responses only echo the ACAO header for
#        listed origins — so the wrong value here breaks the wss login connection.
#   2. Point the client's config.ini at the generated region list:
#        serversUrl=//service.thaira2.com/servers.ini
#      (or put a copy of server/servers.ini on play.thaira2.com and use
#      //play.thaira2.com/servers.ini instead). Keep gameVersion in sync with the
#      server's GAME_VERSION.
#   3. Cloudflare: add service.thaira2.com, SSL mode "Full (strict)" if you use the
#      origin-certificate block below, otherwise "Flexible" (origin on plain HTTP:80).
#      WebSocket proxying is enabled by default for *.thaira2.com zones.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Cloudflare publishes its edge IP ranges here; uncomment once configured so
# X-Real-IP reflects the actual visitor instead of a Cloudflare edge.
# set_real_ip_from 173.245.48.0/20;
# set_real_ip_from 103.21.244.0/22;
# set_real_ip_from 103.22.200.0/22;
# set_real_ip_from 103.31.4.0/22;
# set_real_ip_from 141.101.64.0/18;
# set_real_ip_from 108.162.192.0/18;
# set_real_ip_from 190.93.240.0/20;
# set_real_ip_from 188.114.96.0/20;
# set_real_ip_from 197.234.240.0/22;
# set_real_ip_from 198.41.128.0/17;
# set_real_ip_from 162.158.0.0/15;
# set_real_ip_from 104.16.0.0/13;
# set_real_ip_from 104.24.0.0/14;
# set_real_ip_from 172.64.0.0/13;
# set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    server_name service.thaira2.com;

    client_max_body_size 100m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Everything goes straight to the Bun server. It routes by path + Upgrade
    # header itself: /wol and /gserv are WebSocket, /login /register /auth/*,
    # /servers.ini and /health are HTTP.
    location / {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ---- Optional: origin certificate (Cloudflare Origin CA) so nginx speaks TLS too.
# Needed only if Cloudflare SSL mode is "Full (strict)". Cloudflare's "Edge Certificates"
