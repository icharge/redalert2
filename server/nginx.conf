# RA2Web reverse proxy behind Cloudflare: TLS is terminated by Cloudflare, so nginx
# only proxies plain HTTP/WebSocket to the Bun WOL server. Let's Encrypt is handled
# by Cloudflare (SSL/TLS tab) — nginx manages no certificates here.
#
# Setup
# -----
#   1. Build the client and place it where nginx serves it:
#        cd <repo> && bun run build:prod   # minified build -> ./dist
#      then point `root` below at that dist directory (or copy it to /srv/ra2web/dist).
#   2. Run the Bun server behind nginx (bind to loopback):
#        cd server && SERVER_HOST=127.0.0.1 \
#          EXTERNAL_URL=wss://service.thaira2.com \
#          WOL_URL_PATH=/wol \
#          CORS_ALLOWED_ORIGINS=https://service.thaira2.com \
#          bun run dev
#      - EXTERNAL_URL is what clients use for wss:// and the gserv URL handed out in
#        STARTG (it must be the public wss base seen by browsers, e.g.
#        wss://service.thaira2.com).
#      - WOL_URL_PATH=/wol makes the WOL WebSocket live at /wol so the static root can
#        serve the client without fighting over the / location.
#      - CORS_ALLOWED_ORIGINS=https://service.thaira2.com is required because
#        AuthService/RealmService send credentials and the browser echoes Origin.
#   3. Point the client's config.ini at this host:
#        serversUrl=https://service.thaira2.com/servers.ini
#      The server generates /servers.ini from EXTERNAL_URL + WOL_URL_PATH.
#   4. Cloudflare: add service.thaira2.com, SSL mode "Full (strict)" if you use the
#      origin-certificate block below, otherwise "Flexible" (origin on plain HTTP:80).
#      WebSocket proxying is enabled by default for *.thaira2.com zones.
#
# CDN note: the client's config.ini references /cdn/game-res/v2/, /cdn/maps/, /cdn/mods/.
# Add locations for those (or leave them to an existing CDN) as needed; they are not
# served by the Bun server or by this file.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Cloudflare publishes its edge IP ranges here; uncomment once configured so
# X-Real-IP reflects the actual visitor instead of a Cloudflare edge.
# set_real_ip_from 173.245.48.0/20;
# set_real_ip_from 103.21.244.0/22;
# set_real_ip_from 103.22.200.0/22;
# set_real_ip_from 103.31.4.0/22;
# set_real_ip_from 141.101.64.0/18;
# set_real_ip_from 108.162.192.0/18;
# set_real_ip_from 190.93.240.0/20;
# set_real_ip_from 188.114.96.0/20;
# set_real_ip_from 197.234.240.0/22;
# set_real_ip_from 198.41.128.0/17;
# set_real_ip_from 162.158.0.0/15;
# set_real_ip_from 104.16.0.0/13;
# set_real_ip_from 104.24.0.0/14;
# set_real_ip_from 172.64.0.0/13;
# set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    server_name service.thaira2.com;

    client_max_body_size 100m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # ---- WOL lobby/channel WebSocket (wss://service.thaira2.com/wol) ----
    location = /wol {
        proxy_pass http://127.0.0.1:9090/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- gserv match-relay WebSocket (wss://service.thaira2.com/gserv) ----
    location = /gserv {
        proxy_pass http://127.0.0.1:9090/gserv;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- HTTP API (login, register, gateway auth, servers.ini, health) ----
    location ~ ^/(login|register|auth(/.*)?|servers\.ini|health)$ {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Static client (built ./dist) ----
    location / {
        root /srv/ra2web/dist;
        try_files $uri $uri/ /index.html;
    }

    # Hashed/vendor assets are cacheable long-term.
    location ~* \.(js|css|png|jpe?g|gif|svg|webp|woff2?|ttf|eot|otf|mp3|ogg|wasm|mix|ini)$ {
        root /srv/ra2web/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

# ---- Optional: origin certificate (Cloudflare Origin CA) so nginx speaks TLS too.
# Needed only if Cloudflare SSL mode is "Full (strict)". Cloudflare's "Edge Certificates"
# -> "Origin Server" generates the pair. With this enabled, drop the plain-HTTP server
# above or point Cloudflare at the 443 port.
# server {
#     listen 443 ssl http2;
#     server_name service.thaira2.com;
#
#     ssl_certificate     /etc/cloudflare/service.thaira2.com.pem;
#     ssl_certificate_key /etc/cloudflare/service.thaira2.com.key;
#
#     # ... same locations as above ...
# }
