; serversUrl=//gateway.chronodivide.com/legacy/realms/servers.ini
; serversUrl=//service.thaira2.com/servers.ini
; serversUrl=//play.thaira2.com/servers.ini
; Relative (no scheme/host): resolves against whatever origin the browser is
; actually on (ResourceLoader prepends "/", see src/engine/ResourceLoader.ts)
; — works whether you load localhost, 127.0.0.1, or a LAN IP, since vite
; proxies /servers.ini to the backend regardless (scripts/dev-all.mjs).
serversUrl=servers.ini

gameResArchiveUrl=https://play.thaira2.com/_dl/Red-Alert-2-Multiplayer.exe
gameResExpansionArchiveUrl=https://archive.org/download/yuris-revenge-multiplayer/Yuris-Revenge-Multiplayer.exe
gameResExpansionMusicUrl=https://xwis.net/dl/thememd.mix

; gameresBaseUrl=/cdn/game-res/v2/
mapsBaseUrl=/res/maps/
modsBaseUrl=/cdn/mods/
; mapsBaseUrl=//gameres.chronodivide.com/map/
; modsBaseUrl=//gameres.chronodivide.com/mod/
; Live-updatable map list, fetched over HTTP before missions.pkt (ini.mix) is
; read. Set to a URL serving a [MultiMaps] INI, e.g. https://mapcdn.example.com/maps.pkt
; mapsPktUrl=
patchNotesUrl=//play.thaira2.com/patch-notes.html
ladderRulesUrl=//play.thaira2.com/ladder-rules.html
modSdkUrl=https://github.com/chronodivide/mod-sdk
donateUrl="//thaira2.com/#donate"
replaysUrlWhitelist=".thaira2.com"
breakingNewsUrl=//play.thaira2.com/breaking-news.html
; breakingNewsUrl=//gameres.chronodivide.com/content/breaking-news.html
oldClientsBaseUrl=/old/
legacyRegistrationEnabled=yes
quickMatchEnabled=no
checkMixesIntegrity=false
unrankedQueueEnabled=yes
botsEnabled=yes
debugLogging=wol
debugGameState=yes
defaultLanguage=en-US
viewport.width=1024
viewport.height=768

[Gateway]
; baseUrl=//service.thaira2.com
; Relative: resolves against the current origin (GatewayConfig concatenates
; this directly, e.g. "/" + "auth/session" = "/auth/session"), same reasoning
; as serversUrl above.
baseUrl=/
; baseUrl=//gateway.chronodivide.com/

[AuthProvider.discord]
