<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>RA2Web Admin</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, sans-serif; background: #14161a; color: #d7dae0; }
        header { display: flex; align-items: center; gap: 1rem; padding: 0.6rem 1rem; background: #1c2026; border-bottom: 1px solid #2a2f38; }
        header h1 { font-size: 1rem; margin: 0; color: #9fb3d1; letter-spacing: 0.05em; }
        header nav { display: flex; gap: 0.3rem; margin-left: 1rem; }
        header nav button { background: none; border: none; color: #8b95a5; padding: 0.4rem 0.8rem; cursor: pointer; border-radius: 6px; font-size: 0.9rem; }
        header nav button.active { background: #2b5d8a; color: #fff; }
        header .spacer { flex: 1; }
        main { padding: 1rem; max-width: 1200px; margin: 0 auto; }
        .card { background: #1c2026; border: 1px solid #2a2f38; border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.8rem; }
        .stat { background: #232830; border: 1px solid #2e3440; border-radius: 8px; padding: 0.8rem; text-align: center; }
        .stat .value { font-size: 1.6rem; font-weight: 700; color: #e8edf4; }
        .stat .label { font-size: 0.75rem; color: #8b95a5; margin-top: 0.2rem; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #262b33; }
        th { color: #8b95a5; font-weight: 600; }
        tr:hover td { background: #22262e; }
        input, select { background: #14161a; color: #d7dae0; border: 1px solid #333a45; border-radius: 6px; padding: 0.4rem 0.6rem; font-size: 0.9rem; }
        button.primary { background: #2b5d8a; color: #fff; border: none; border-radius: 6px; padding: 0.5rem 1rem; cursor: pointer; }
        button.danger { background: #7a2e2e; color: #fff; border: none; border-radius: 6px; padding: 0.3rem 0.7rem; cursor: pointer; font-size: 0.8rem; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .error { color: #e07b7b; }
        .muted { color: #8b95a5; }
        .win { color: #6fce8f; } .loss { color: #e07b7b; } .draw { color: #d9c26a; }
        .badge { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 10px; font-size: 0.7rem; background: #2e3440; color: #aeb7c5; }
        .badge.current { background: #2b5d2b; color: #b5e3b5; }
        .badge.closed { background: #5d2b2b; color: #e3b5b5; }
        .login { max-width: 380px; margin: 10vh auto; }
        .login h2 { color: #9fb3d1; }
        .row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; margin-bottom: 0.8rem; }
        pre.payload { background: #14161a; border-radius: 6px; padding: 0.6rem; font-size: 0.72rem; overflow-x: auto; max-height: 300px; }
        .season-create { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
        .season-create input { width: 220px; }
        .season-create input.short { width: 110px; }
    </style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
